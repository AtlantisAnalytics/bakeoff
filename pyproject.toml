[project]
name = "bakeoff"
version = "0.1.0"
description = "Open benchmark harness for open-weight models on consumer GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx"]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakeoff"]

[tool.hatch.build.targets.wheel.force-include]
"suites" = "bakeoff/suites"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["brand", "docs", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

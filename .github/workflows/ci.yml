name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned to match the lab hosts (Ubuntu 24.04, Python 3.12). ubuntu-latest moved to 26.04 and
    # Python 3.14 on 2026-10-19 and changed results under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - run: uv run bakeoff site --check
      - name: Check the ledger of published bundles
        run: uv run bakeoff verify --ledger --no-username
      - name: Verify bundles changed by this pull request
        if: github.event_name == 'pull_request'
        run: uv run bakeoff verify --changed origin/${{ github.base_ref || 'main' }} --no-username
      - run: uv run python scripts/scan_repo.py
